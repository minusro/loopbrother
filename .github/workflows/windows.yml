# Windows build: the VST3 and the app, the engine tests, and an Inno Setup
# installer, uploaded as an artifact. When a release is published
# (installer/release.sh, which also adds the Mac installer) the Windows
# installer is attached to it. Unsigned for now (docs/RELEASE.md).
name: windows

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # to attach the installer to a release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version
        shell: pwsh
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(junglemassive VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          "VER=$ver" >> $env:GITHUB_ENV

      - name: Configure
        run: cmake -B build -DJM_INSTALL_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Engine tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Installer (Inno Setup)
        shell: pwsh
        run: iscc /DVersion=$env:VER "/DArtefacts=$PWD\build\junglemassive_artefacts\Release" /O"$PWD\dist" installer\windows\loopbrother.iss

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: LOOP-BROTHER-${{ env.VER }}-windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("v$env:VER" -ne "${{ github.event.release.tag_name }}") { throw "release ${{ github.event.release.tag_name }} doesn't match version $env:VER" }
          gh release upload "${{ github.event.release.tag_name }}" (Get-ChildItem dist\*.exe).FullName --clobber
